name: Veille quotidienne

on:
  schedule:
    # 8h00 heure de Paris en été (UTC+2) = 6h00 UTC.
    # En hiver (UTC+1), ça arrivera à 7h heure de Paris — GitHub Actions ne
    # gère pas le changement d'heure automatiquement. À ajuster à la main
    # (remplacer "0 6" par "0 7") fin octobre si besoin d'une précision exacte.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Générer la veille du jour
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python veille.py --mode daily --output docs/index.html

      - name: Publier la page mise à jour
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Mise à jour veille quotidienne"
          git push
